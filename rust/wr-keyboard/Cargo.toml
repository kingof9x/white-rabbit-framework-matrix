[package]
name = "wr-keyboard"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The Framework 16 RGB keyboard and RGB macropad: protocol, effects, devices, lighting engine and picture"

[dependencies]
# The audio show: White Rabbit's own sound capture and analysis
wr-music = { version = "0.1.0", path = "../wr-music" }
# Draws the keyboard picture
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }

# Pure-Rust HID backend on Windows: no C compiler or driver install needed.
[target.'cfg(windows)'.dependencies]
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }
# The audio show's Ctrl+Alt+Shift+M (a keyboard hook)
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(not(windows))'.dependencies]
hidapi = "2.6"
