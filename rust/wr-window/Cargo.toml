[package]
name = "wr-window"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false
description = "White Rabbit's window, in Rust (WhiteRabbitWindow.exe): the pages for the panels, the layout editor and settings"

[[bin]]
name = "WhiteRabbitWindow"
path = "src/main.rs"

[dependencies]
wr-core = { path = "../wr-core" }
wr-panel = { path = "../wr-panel" }
wr-music = { path = "../wr-music" }
slint = { version = "1.18", default-features = false, features = [
    "std",
    "compat-1-2",
    "accessibility",
    "backend-winit",
    "renderer-software",
    "software-renderer-systemfonts",
    "raw-window-handle-06",
] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
serde_yaml = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
hmac = "0.12"
md-5 = "0.10"
sha2 = "0.10"
getrandom = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "gif", "jpeg", "bmp"] }

[target.'cfg(windows)'.dependencies]
rfd = { version = "0.15", default-features = false }
raw-window-handle = "0.6"
ureq = { version = "3", default-features = false, features = ["native-tls", "json"] }
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "1.18"
