# The Rust version of White Rabbit's monitor (see the "Rust rewrite" plan).
#   wr-core     drawing, settings and layout, the same on every platform (tested against tests/golden/)
#   wr-monitor  the Windows program: panels, tray menu, lid and sleep, keyboard shortcuts
[workspace]
members = ["wr-core", "wr-monitor"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
