name: Rust monitor

# The Rust app (rust/). Checks formatting, tests and lints, including that it still draws exactly
# what the Python monitor draws (the golden frames in tests/golden/). The exe, installer and
# portable zip are built once, by Build and release (windows.yml); this workflow doesn't build
# them a second time.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to the same PR cancels its older, now pointless build.
  # Runs on main (pushes and releases) are never cancelled.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The window (wr-window, Slint) needs these to build and run its tests on Linux
      - name: Linux libraries for the window
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libudev-dev
      - name: Formatting
        run: cargo fmt --check
      - name: Tests
        run: cargo test --workspace
      - name: Lints
        run: cargo clippy --workspace --all-targets -- -D warnings

