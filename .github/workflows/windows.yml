name: Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Version for a new GitHub Release (e.g. 1.0.0). Leave empty for a test build with no release."
        required: false

permissions:
  contents: write  # publish the GitHub Release

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install pytest pyserial pyyaml python-dotenv numpy psutil pillow
      - name: Run tests
        run: python -m pytest

  build:
    name: Build exe and installer
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # PyInstaller's prebuilt launcher is shared by many malware samples, so antivirus engines flag
      # anything built with it. Compiling our own launcher gives the exe a unique, unflagged one.
      - name: Install PyInstaller with a launcher compiled from source
        shell: pwsh
        run: |
          python -m pip download --no-binary :all: --no-deps --no-cache-dir pyinstaller -d pyi-src
          python -c "import glob, tarfile; tarfile.open(glob.glob('pyi-src/pyinstaller-*.tar.gz')[0]).extractall('pyi-src', filter='data')"
          $src = (Get-ChildItem pyi-src -Directory | Select-Object -First 1).FullName
          Push-Location "$src\bootloader"
          python ./waf all --target-arch=64bit
          if ($LASTEXITCODE -ne 0) { throw "Compiling the PyInstaller launcher failed" }
          Pop-Location
          python -m pip install $src
          # Show the launcher's hash, to compare with the prebuilt one if needed
          python -c "import hashlib, os, PyInstaller; p = os.path.join(os.path.dirname(PyInstaller.__file__), 'bootloader', 'Windows-64bit-intel', 'runw.exe'); print(p, hashlib.sha256(open(p, 'rb').read()).hexdigest())"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Run tests with the full dependencies
        run: python -m pytest

      # A v* tag or the version typed into "Run workflow" wins; a test build uses pyproject.toml's version
      - name: Work out the version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") { $version = "${{ github.ref_name }}".TrimStart("v") }
          elseif ("${{ inputs.version }}") { $version = "${{ inputs.version }}".Trim().TrimStart("v") }
          else { $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])" }
          "version=$version" >> $env:GITHUB_OUTPUT
          # Numbers only (1.2.0-beta becomes 1.2.0) for the installer's file details
          $numbers = ([regex]::Matches($version, '\d+') | Select-Object -First 4 | ForEach-Object { $_.Value }) -join '.'
          if (-not $numbers) { $numbers = "0.0.0" }
          "numbers=$numbers" >> $env:GITHUB_OUTPUT
          "WHITE_RABBIT_VERSION=$version" >> $env:GITHUB_ENV
          Write-Host "Version $version"

      # Firmware for the Firmware tab: this project's (built in kingof9x/inputmodule-rs) and Framework's official one
      - name: Download firmware to bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force res\releases\white-rabbit, res\releases\framework-0.2.0, dist | Out-Null
          Invoke-WebRequest https://github.com/kingof9x/inputmodule-rs/releases/latest/download/ledmatrix.uf2 -OutFile res\releases\white-rabbit\ledmatrix.uf2
          Invoke-WebRequest https://github.com/FrameworkComputer/inputmodule-rs/releases/download/v0.2.0/ledmatrix.uf2 -OutFile res\releases\framework-0.2.0\ledmatrix.uf2
          Copy-Item res\releases\white-rabbit\ledmatrix.uf2 dist\ledmatrix.uf2
          Get-ChildItem -Recurse res\releases -File | Format-Table FullName, Length

      - name: Build one-dir (for the installer)
        run: python -m PyInstaller white_rabbit.spec --noconfirm --clean --workpath build\onedir

      # The fps app runs Intel's PresentMon (MIT licence). The installer ships it next to WhiteRabbit.exe;
      # it isn't packed inside the portable exe, since an exe hidden inside another looks suspicious to scanners.
      - name: Add PresentMon to the installed app
        shell: pwsh
        env:
          PRESENTMON_VERSION: v2.6.0
        run: |
          $headers = @{ Authorization = "Bearer ${{ github.token }}"; "X-GitHub-Api-Version" = "2022-11-28" }
          $release = Invoke-RestMethod -Headers $headers "https://api.github.com/repos/GameTechDev/PresentMon/releases/tags/$env:PRESENTMON_VERSION"
          $asset = @($release.assets | Where-Object { $_.name -match '^PresentMon-[\d.]+-x64\.exe$' })
          if ($asset.Count -ne 1) {
            $release.assets | ForEach-Object { Write-Host $_.name }
            throw "Expected one PresentMon console exe in release $env:PRESENTMON_VERSION"
          }
          Write-Host "Using $($asset[0].name)"
          Invoke-WebRequest -Headers $headers $asset[0].browser_download_url -OutFile dist\WhiteRabbit\PresentMon.exe
          $license = Invoke-RestMethod -Headers $headers "https://api.github.com/repos/GameTechDev/PresentMon/license?ref=$env:PRESENTMON_VERSION"
          [IO.File]::WriteAllBytes("$PWD\dist\WhiteRabbit\PresentMon-LICENSE.txt", [Convert]::FromBase64String($license.content))
          Get-AuthenticodeSignature dist\WhiteRabbit\PresentMon.exe | Format-List Status, SignerCertificate

      - name: Build one-file (portable exe)
        shell: pwsh
        run: |
          $env:WHITE_RABBIT_ONEFILE = "1"
          python -m PyInstaller white_rabbit.spec --noconfirm --clean --workpath build\onefile

      - name: Smoke test (--list-apps, no panels needed)
        shell: pwsh
        run: |
          foreach ($exe in @("dist\WhiteRabbit.exe", "dist\WhiteRabbit\WhiteRabbit.exe")) {
            Write-Host "== $exe --list-apps"
            # The exe is windowless, so start it explicitly and wait for its exit code
            $p = Start-Process -FilePath $exe -ArgumentList "--list-apps" -PassThru -NoNewWindow `
                 -RedirectStandardOutput smoke-out.txt -RedirectStandardError smoke-err.txt
            $null = $p.Handle
            if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "$exe --list-apps did not exit" }
            Get-Content smoke-out.txt, smoke-err.txt -ErrorAction SilentlyContinue
            if ($p.ExitCode -ne 0) { throw "$exe --list-apps exited with $($p.ExitCode)" }
          }

      - name: Smoke test (the window opens with all its tabs and closes)
        shell: pwsh
        run: |
          $env:WHITE_RABBIT_SMOKE_TEST = "1"
          $env:APPDATA = "$PWD\smoke-appdata"
          $env:LOCALAPPDATA = "$PWD\smoke-appdata"
          # The second run opens the Audio tab, whose preview listens to the sound (the runner has no sound card)
          foreach ($exe in @("dist\WhiteRabbit.exe", "dist\WhiteRabbit\WhiteRabbit.exe")) {
            foreach ($arguments in @("--window", "--window --tab audio")) {
              Write-Host "== $exe $arguments"
              $p = Start-Process -FilePath $exe -ArgumentList $arguments -PassThru
              $null = $p.Handle
              if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "$exe $arguments did not exit" }
              $log = "smoke-appdata\WhiteRabbit\WhiteRabbit.log"
              Get-Content $log -ErrorAction SilentlyContinue
              if ($p.ExitCode -ne 0) { throw "$exe $arguments exited with $($p.ExitCode)" }
              if (Select-String -Path $log -Pattern "Traceback|couldn.t start|Smoke test failed|preview failed" -Quiet) { throw "$exe $arguments logged an error" }
              if (-not (Select-String -Path $log -Pattern "Smoke test: temperature and fan source" -Quiet)) { throw "$exe $arguments didn't check the temperature and fan source" }
              if (-not (Select-String -Path $log -Pattern "Smoke test: temperature and fan refresh" -Quiet)) { throw "$exe $arguments didn't check the refresh setting" }
              if (-not (Select-String -Path $log -Pattern "Smoke test: weather location settings shown" -Quiet)) { throw "$exe $arguments didn't show the weather location settings" }
              if (-not (Select-String -Path $log -Pattern "Smoke test: Info tab shows version" -Quiet)) { throw "$exe $arguments didn't show its version on the Info tab" }
            }
          }

      - name: Check the temperature and fan sources in the built exe
        shell: pwsh
        run: |
          $headers = @{ Authorization = "Bearer ${{ github.token }}"; "X-GitHub-Api-Version" = "2022-11-28" }
          # A stand-in for Framework Control's service: its config file (where the port is read from) and /api/thermal
          $fake = "$PWD\fake-programfiles"
          New-Item -ItemType Directory -Force "$fake\FrameworkControl" | Out-Null
          Set-Content "$fake\FrameworkControl\FrameworkControlService.xml" '<service><env name="FRAMEWORK_CONTROL_PORT" value="8765"/></service>'
          $server = Start-Process python -ArgumentList ".github\ci\fake_framework_control.py", "8765" -PassThru -NoNewWindow
          # Libre Hardware Monitor, running as admin (the runner is admin), so its WMI sensors exist
          try {
            $release = Invoke-RestMethod -Headers $headers "https://api.github.com/repos/LibreHardwareMonitor/LibreHardwareMonitor/releases/latest"
            $asset = @($release.assets | Where-Object { $_.name -match '\.zip$' } | Sort-Object { $_.name -notmatch 'net4' })[0]
            Write-Host "Libre Hardware Monitor $($release.tag_name): $($asset.name)"
            Invoke-WebRequest -Headers $headers $asset.browser_download_url -OutFile lhm.zip
            Expand-Archive lhm.zip lhm -Force
            $lhmExe = (Get-ChildItem lhm -Recurse -Filter LibreHardwareMonitor.exe | Select-Object -First 1).FullName
            $lhm = Start-Process $lhmExe -PassThru
          } catch { Write-Host "Couldn't start Libre Hardware Monitor: $_" }
          # framework_tool.exe next to the portable exe
          try {
            $release = Invoke-RestMethod -Headers $headers "https://api.github.com/repos/FrameworkComputer/framework-system/releases/latest"
            $asset = @($release.assets | Where-Object { $_.name -eq 'framework_tool.exe' })[0]
            Write-Host "framework_tool $($release.tag_name)"
            Invoke-WebRequest -Headers $headers $asset.browser_download_url -OutFile dist\framework_tool.exe
          } catch { Write-Host "Couldn't download framework_tool: $_" }
          Start-Sleep -Seconds 15

          # Windows gives 64-bit programs ProgramFiles from ProgramW6432, so point both at the stand-in
          $env:ProgramFiles = $fake
          $env:ProgramW6432 = $fake
          if ($lhm) {
            Write-Host "Libre Hardware Monitor still running: $(-not $lhm.HasExited)"
            try { Get-CimInstance -Namespace root/LibreHardwareMonitor -ClassName Sensor -ErrorAction Stop |
                  Where-Object { $_.SensorType -in 'Temperature', 'Fan' } | Format-Table Parent, Name, SensorType, Value }
            catch { Write-Host "Its WMI sensors aren't there: $_" }
          }
          $env:APPDATA = "$PWD\sensor-appdata"
          $env:LOCALAPPDATA = "$PWD\sensor-appdata"
          New-Item -ItemType Directory -Force "sensor-appdata\WhiteRabbit" | Out-Null
          $outputs = @{}
          foreach ($choice in @("auto", "framework_control", "libre_hardware_monitor", "framework_tool")) {
            Set-Content "sensor-appdata\WhiteRabbit\settings.json" "{`"sensor_source`": `"$choice`"}"
            $p = Start-Process -FilePath dist\WhiteRabbit.exe -ArgumentList "--diagnose" -PassThru -NoNewWindow `
                 -RedirectStandardOutput sensor-out.txt -RedirectStandardError sensor-err.txt
            $null = $p.Handle
            if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "--diagnose did not exit" }
            $text = (Get-Content sensor-out.txt, sensor-err.txt -ErrorAction SilentlyContinue) -join "`n"
            Write-Host "== sensor_source = $choice"
            Write-Host $text
            if ($p.ExitCode -ne 0) { throw "--diagnose exited with $($p.ExitCode)" }
            if ($text -notmatch "Chosen source: .*\($choice\)") { throw "--diagnose didn't use the $choice setting" }
            if ($text -match "Traceback|No module named") { throw "--diagnose hit an error with $choice" }
            $outputs[$choice] = $text
          }
          # Windows Location for the weather app: the exe must include WinRT geolocation and get a clear answer
          if ($outputs["auto"] -notmatch "Windows Location \(weather\): (on|not available)") { throw "--diagnose didn't check Windows Location" }
          if ($outputs["auto"] -match "WinRT geolocation isn't installed|can't be used on this computer") { throw "The exe can't use Windows Location" }
          # The Microsoft Store app's "Start with Windows" needs WinRT's startup task in the exe
          if ($outputs["auto"] -notmatch "Store startup task support: included") { throw "The exe is missing the Store startup task support" }
          Stop-Process -Id $server.Id -ErrorAction SilentlyContinue
          if ($lhm) { Stop-Process -Id $lhm.Id -ErrorAction SilentlyContinue }
          # Framework Control (the stand-in) gives its four temperatures and both fans, and both choices that
          # include it put them on the panels
          if ($outputs["auto"] -notmatch "Framework Control: 4 temperatures \[44, 43, 41, 40\], 2 fans \[0, 0\]") { throw "Framework Control wasn't read" }
          foreach ($choice in @("auto", "framework_control")) {
            if ($outputs[$choice] -notmatch "Panels get: temperatures from Framework Control, fans from Framework Control") { throw "$choice didn't use Framework Control" }
            if ($outputs[$choice] -notmatch "Temperatures app can show: cpu@4c \(44 C\), apu_f75303@4d \(43 C\)") { throw "$choice didn't list Framework Control's sensors" }
          }
          # A fixed choice of another source must not use Framework Control's readings
          foreach ($choice in @("libre_hardware_monitor", "framework_tool")) {
            if ($outputs[$choice] -match "Panels get: temperatures from Framework Control|fans from Framework Control") { throw "$choice used Framework Control" }
          }

      # Code signing placeholder (not enabled yet). Unsigned builds show a SmartScreen warning.
      # - name: Sign executables
      #   shell: pwsh
      #   run: |
      #     signtool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
      #       /f cert.pfx /p "${{ secrets.SIGNING_CERT_PASSWORD }}" dist\WhiteRabbit.exe dist\WhiteRabbit\WhiteRabbit.exe

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.version.outputs.version }}" "/DAppVersionNumbers=${{ steps.version.outputs.numbers }}" installer\white_rabbit.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          # Both exes should carry their file details (antivirus scanners distrust blank ones)
          foreach ($exe in @("dist\WhiteRabbit-setup.exe", "dist\WhiteRabbit.exe")) {
            $info = (Get-Item $exe).VersionInfo
            $info | Format-List FileName, FileVersion, ProductVersion, CompanyName, FileDescription, ProductName, LegalCopyright
            if (-not $info.CompanyName -or $info.FileVersion -match '^0\.0\.0') { throw "$exe has blank file details" }
          }

      # The Microsoft Store package. The Store signs it, so it isn't signed here. Its identity comes from
      # the repository's Actions variables (Settings > Secrets and variables > Actions > Variables), copied
      # from Partner Center > the app > Product identity. Without them it's a test package the Store refuses.
      - name: Build Microsoft Store package (MSIX)
        shell: pwsh
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: |
          python scripts/build_msix.py --version "${{ steps.version.outputs.version }}"
          if ($LASTEXITCODE -ne 0) { throw "Building the MSIX failed" }
          Get-Item dist\WhiteRabbit.msix | Format-Table Name, Length

      # Install a copy of the package the way Windows would from the Store, start it, and check it runs
      # packaged. Windows only installs signed packages, so the copy gets a throwaway certificate.
      - name: Test-install the Store package
        shell: pwsh
        run: |
          [xml]$manifest = Get-Content build\msix\layout\AppxManifest.xml
          $publisher = $manifest.Package.Identity.Publisher
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject $publisher -KeyUsage DigitalSignature `
                  -CertStoreLocation Cert:\CurrentUser\My -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $password = ConvertTo-SecureString -String ([guid]::NewGuid().ToString()) -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath test-cert.pfx -Password $password | Out-Null
          Import-PfxCertificate -FilePath test-cert.pfx -CertStoreLocation Cert:\LocalMachine\TrustedPeople -Password $password | Out-Null
          Copy-Item dist\WhiteRabbit.msix test-signed.msix
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1).FullName
          & $signtool sign /fd SHA256 /sha1 $cert.Thumbprint /s My test-signed.msix
          if ($LASTEXITCODE -ne 0) { throw "Signing the test copy failed" }

          Add-AppxPackage -Path test-signed.msix
          $package = Get-AppxPackage -Name $manifest.Package.Identity.Name
          if (-not $package) { throw "The package didn't install" }
          $package | Format-List Name, Version, PackageFamilyName, InstallLocation
          $family = $package.PackageFamilyName
          $log = "$env:LOCALAPPDATA\Packages\$family\LocalState\WhiteRabbit\WhiteRabbit.log"

          # Opened from Start: the monitor and the window, both from the package
          Start-Process "shell:AppsFolder\$family!WhiteRabbit"
          $deadline = (Get-Date).AddSeconds(90)
          while ((Get-Date) -lt $deadline) {
            $running = @(Get-Process WhiteRabbit -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$($package.InstallLocation)*" })
            if ($running.Count -ge 2 -and (Test-Path $log) -and (Select-String -Path $log -Pattern "Microsoft Store app" -Quiet)) { break }
            Start-Sleep -Seconds 3
          }
          Start-Sleep -Seconds 10
          Get-Process WhiteRabbit -ErrorAction SilentlyContinue | Format-Table Id, Path
          Get-Content $log -ErrorAction SilentlyContinue
          $running = @(Get-Process WhiteRabbit -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$($package.InstallLocation)*" })
          Get-Process WhiteRabbit -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          Remove-AppxPackage -Package $package.PackageFullName
          if (-not (Test-Path $log)) { throw "The Store app didn't write its log in its package data folder" }
          if (-not (Select-String -Path $log -Pattern "Running as the Microsoft Store app \($([regex]::Escape($family))\)" -Quiet)) { throw "The app didn't know it was the Store app" }
          if (Select-String -Path $log -Pattern "Traceback|stopped with an error|couldn.t start" -Quiet) { throw "The Store app logged an error" }
          if ($running.Count -lt 2) { throw "Expected the monitor and the window running from the package, found $($running.Count)" }

      - name: Upload Microsoft Store package
        uses: actions/upload-artifact@v4
        with:
          name: WhiteRabbit.msix
          path: dist/WhiteRabbit.msix
          if-no-files-found: error

      - name: Upload portable exe
        uses: actions/upload-artifact@v4
        with:
          name: WhiteRabbit.exe
          path: dist/WhiteRabbit.exe
          if-no-files-found: error

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: WhiteRabbit-setup.exe
          path: dist/WhiteRabbit-setup.exe
          if-no-files-found: error

      # A v* tag, or a manual run with a version, publishes a GitHub Release.
      # The file names stay the same in every release so the README's "latest" download links keep working.
      - name: Publish GitHub Release
        if: github.ref_type == 'tag' || inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: White Rabbit ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          body: |
            - `WhiteRabbit-setup.exe`: installer (starts with Windows, Start menu shortcut)
            - `WhiteRabbit.exe`: portable app, nothing is installed
            - `ledmatrix.uf2`: LED Matrix firmware with the startup animation setting and the extra Game of Life patterns (the app's Firmware tab can flash it too)
          generate_release_notes: true
          make_latest: "true"
          fail_on_unmatched_files: true
          files: |
            dist/WhiteRabbit.exe
            dist/WhiteRabbit-setup.exe
            dist/ledmatrix.uf2
