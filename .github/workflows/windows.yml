name: Build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version. "next" = last release + 1 (for example 1.3 after 1.2), or type one (for example 2.0). Empty = only test the build, no release.'
        required: false
        default: 'next'

permissions:
  contents: write  # publish the GitHub Release

concurrency:
  # A newer push to the same PR cancels its older, now pointless build.
  # Runs on main (pushes and releases) are never cancelled.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    # Works out the release version: from the Run workflow box ("next" = last release + 1)
    # or from a pushed v* tag. Empty means "only test the build, no release".
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          INPUT: ${{ inputs.version }}
        run: |
          v=""
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            v=$(printf '%s' "$GITHUB_REF_NAME" | grep -oE '[0-9]+(\.[0-9]+)*$' || true)
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ -n "$INPUT" ]; then
            if [ "$INPUT" = next ]; then
              last=$(gh api "repos/$REPO/releases?per_page=100" --jq '[.[] | select(.draft == false and .prerelease == false) | .tag_name][0] // ""')
              num=$(printf '%s' "$last" | grep -oE '[0-9]+(\.[0-9]+)*$' || true)
              if [ -z "$num" ]; then
                echo "::error::There is no release yet, so there is nothing to add 1 to. Run again and type the first version (for example 1.0)."; exit 1
              fi
              v=$(printf '%s' "$num" | awk -F. -v OFS=. '{$NF=$NF+1; print}')
              echo "Last release: ${last:-none}"
            else
              v="${INPUT#[vV]}"
            fi
          fi
          if [ -n "$v" ] && ! printf '%s' "$v" | grep -qE '^[0-9]+(\.[0-9]+)*$'; then
            echo "::error::'$v' is not a version number. Use numbers like 1.4 or 2.0.1, or 'next'."; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=${v:+v$v}" >> "$GITHUB_OUTPUT"
          if [ -n "$v" ]; then echo "### Releasing v$v" >> "$GITHUB_STEP_SUMMARY"; else echo "### Test build only, no release" >> "$GITHUB_STEP_SUMMARY"; fi

  tests:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install pytest pyserial pyyaml python-dotenv numpy psutil pillow requests
      - name: Run tests
        run: python -m pytest

  build:
    name: Build exe and installer
    # Doesn't wait for the tests: they run at the same time, and the release job below
    # only publishes once both the tests and this build have passed.
    needs: version
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # A v* tag or the Run workflow version box ("next" = last release + 1) wins; a test build is the newest release plus -test.N.
      # WHITE_RABBIT_VERSION goes into both exes (the About page and their file details).
      - name: Work out the version
        id: version
        shell: pwsh
        run: |
          if ("${{ needs.version.outputs.version }}") { $version = "${{ needs.version.outputs.version }}" }
          else {
            # A test build: the newest release's version plus "-test.N", e.g. 1.5-test.230, so Check for
            # updates knows it is a test of that release and only offers a newer one
            $headers = @{ Authorization = "Bearer ${{ github.token }}"; "X-GitHub-Api-Version" = "2022-11-28" }
            try { $base = (Invoke-RestMethod -Headers $headers "https://api.github.com/repos/${{ github.repository }}/releases/latest").tag_name.TrimStart("v") }
            catch { $base = ((Select-String -Path pyproject.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value) }
            $version = "$base-test.${{ github.run_number }}"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          # Numbers only (1.2.0-beta becomes 1.2.0) for the installer's file details
          $numbers = ([regex]::Matches(($version -split '-')[0], '\d+') | Select-Object -First 4 | ForEach-Object { $_.Value }) -join '.'
          if (-not $numbers) { $numbers = "0.0.0" }
          "numbers=$numbers" >> $env:GITHUB_OUTPUT
          "WHITE_RABBIT_VERSION=$version" >> $env:GITHUB_ENV
          Write-Host "Version $version"

      # The whole app is Rust (rust/): WhiteRabbit.exe is the monitor and tray icon, WhiteRabbitWindow.exe the
      # settings window it opens. No Python is shipped.
      - uses: dtolnay/rust-toolchain@stable
      - name: Faster settings for test builds (no version = not a release)
        if: needs.version.outputs.version == ''
        shell: bash
        run: |
          # Real releases keep the full release profile (LTO, few codegen units).
          # Test builds (PRs, pushes to main) skip LTO and use more codegen units:
          # same optimisation level, much shorter compile.
          echo "CARGO_PROFILE_RELEASE_LTO=false" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build the app
        working-directory: rust
        run: cargo build --release -p wr-monitor -p wr-window

      # Firmware for the Firmware page: this project's (built in kingof9x/inputmodule-rs) and Framework's official one
      - name: Put the app together
        shell: pwsh
        run: |
          $app = "dist\WhiteRabbit"
          New-Item -ItemType Directory -Force "$app\res\releases\white-rabbit", "$app\res\releases\framework-0.2.0", "$app\LICENSES" | Out-Null
          Copy-Item rust\target\release\WhiteRabbit.exe, rust\target\release\WhiteRabbitWindow.exe $app
          # The newest firmware release, and its build-N tag so the app can say which build it carries
          $headers = @{ Authorization = "Bearer ${{ github.token }}"; "X-GitHub-Api-Version" = "2022-11-28" }
          $fw = Invoke-RestMethod -Headers $headers https://api.github.com/repos/kingof9x/inputmodule-rs/releases/latest
          $uf2 = @($fw.assets | Where-Object { $_.name -eq 'ledmatrix.uf2' })
          if ($uf2.Count -ne 1) { throw "No ledmatrix.uf2 in firmware release $($fw.tag_name)" }
          Write-Host "Bundling firmware $($fw.tag_name)"
          Invoke-WebRequest $uf2[0].browser_download_url -OutFile "$app\res\releases\white-rabbit\ledmatrix.uf2"
          Set-Content "$app\res\releases\white-rabbit\VERSION" $fw.tag_name -NoNewline
          Invoke-WebRequest https://github.com/FrameworkComputer/inputmodule-rs/releases/download/v0.2.0/ledmatrix.uf2 -OutFile "$app\res\releases\framework-0.2.0\ledmatrix.uf2"
          Copy-Item "$app\res\releases\white-rabbit\ledmatrix.uf2" dist\ledmatrix.uf2
          Copy-Item LICENSE "$app\LICENSE.txt"
          # sv-ttk was the Python window's theme, so it isn't shipped any more
          Copy-Item LICENSES\* "$app\LICENSES" -Exclude sv-ttk-*
          Set-Content "$app\VERSION" $env:WHITE_RABBIT_VERSION -NoNewline
          Get-ChildItem -Recurse $app -File | Format-Table FullName, Length

      # The fps app runs Intel's PresentMon (MIT licence), shipped next to WhiteRabbit.exe
      - name: Add PresentMon
        shell: pwsh
        env:
          PRESENTMON_VERSION: v2.6.0
        run: |
          $headers = @{ Authorization = "Bearer ${{ github.token }}"; "X-GitHub-Api-Version" = "2022-11-28" }
          $release = Invoke-RestMethod -Headers $headers "https://api.github.com/repos/GameTechDev/PresentMon/releases/tags/$env:PRESENTMON_VERSION"
          $asset = @($release.assets | Where-Object { $_.name -match '^PresentMon-[\d.]+-x64\.exe$' })
          if ($asset.Count -ne 1) {
            $release.assets | ForEach-Object { Write-Host $_.name }
            throw "Expected one PresentMon console exe in release $env:PRESENTMON_VERSION"
          }
          Write-Host "Using $($asset[0].name)"
          Invoke-WebRequest -Headers $headers $asset[0].browser_download_url -OutFile dist\WhiteRabbit\PresentMon.exe
          $license = Invoke-RestMethod -Headers $headers "https://api.github.com/repos/GameTechDev/PresentMon/license?ref=$env:PRESENTMON_VERSION"
          [IO.File]::WriteAllBytes("$PWD\dist\WhiteRabbit\PresentMon-LICENSE.txt", [Convert]::FromBase64String($license.content))
          Get-AuthenticodeSignature dist\WhiteRabbit\PresentMon.exe | Format-List Status, SignerCertificate

      - name: Smoke test (--list-apps and --diagnose, no panels needed)
        shell: pwsh
        run: |
          $env:APPDATA = "$PWD\smoke-appdata"
          $env:LOCALAPPDATA = "$PWD\smoke-appdata"
          foreach ($arguments in @("--list-apps", "--diagnose")) {
            $exe = "dist\WhiteRabbit\WhiteRabbitWindow.exe"
            Write-Host "== $exe $arguments"
            # The exe is windowless, so start it explicitly and wait for its exit code
            $p = Start-Process -FilePath $exe -ArgumentList $arguments -PassThru -NoNewWindow `
                 -RedirectStandardOutput smoke-out.txt -RedirectStandardError smoke-err.txt
            $null = $p.Handle
            if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "$exe $arguments did not exit" }
            $text = (Get-Content smoke-out.txt, smoke-err.txt -ErrorAction SilentlyContinue) -join "`n"
            Write-Host $text
            if ($p.ExitCode -ne 0) { throw "$exe $arguments exited with $($p.ExitCode)" }
          }
          if ((Get-Content smoke-out.txt -Raw) -notmatch "White Rabbit $([regex]::Escape($env:WHITE_RABBIT_VERSION)) diagnostics") { throw "--diagnose didn't show the version" }
          # WhiteRabbit.exe hands options meant for the window to WhiteRabbitWindow.exe and exits
          $p = Start-Process -FilePath dist\WhiteRabbit\WhiteRabbit.exe -ArgumentList "--list-apps" -PassThru -NoNewWindow
          $null = $p.Handle
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw "WhiteRabbit.exe --list-apps did not exit" }
          if ($p.ExitCode -ne 0) { throw "WhiteRabbit.exe --list-apps exited with $($p.ExitCode)" }

      - name: Smoke test (the window opens every page and closes)
        shell: pwsh
        run: |
          $env:WHITE_RABBIT_SMOKE_TEST = "1"
          $env:APPDATA = "$PWD\smoke-appdata"
          $env:LOCALAPPDATA = "$PWD\smoke-appdata"
          $log = "smoke-appdata\WhiteRabbit\WhiteRabbit-window.log"
          # The second run opens on the Music page, whose preview listens to the sound (the runner has no sound card)
          # Each start is checked to the end and the failures are listed together
          $failures = @()
          foreach ($arguments in @("--window", "--window --tab games", "--window --tab music", "--window --tab draw")) {
            $exe = "dist\WhiteRabbit\WhiteRabbitWindow.exe"
            Write-Host "== $exe $arguments"
            Remove-Item $log -ErrorAction SilentlyContinue
            $p = Start-Process -FilePath $exe -ArgumentList $arguments -PassThru
            $null = $p.Handle
            if (-not $p.WaitForExit(120000)) { $p.Kill(); $failures += "$arguments did not exit"; continue }
            Get-Content $log -ErrorAction SilentlyContinue
            if ($p.ExitCode -ne 0) { $failures += "$arguments exited with $($p.ExitCode)"; continue }
            if (Select-String -Path $log -Pattern "The window stopped" -Quiet) { $failures += "$arguments crashed"; continue }
            foreach ($page in @("monitor", "games", "music", "math", "draw", "settings", "firmware", "about")) {
              if (-not (Select-String -Path $log -Pattern "Smoke test: page $page shown" -Quiet)) { $failures += "$arguments didn't show the $page page" }
            }
            if (-not (Select-String -Path $log -Pattern "Smoke test: window $([regex]::Escape($env:WHITE_RABBIT_VERSION)) with" -Quiet)) { $failures += "$arguments didn't show its version" }
            if (-not (Select-String -Path $log -Pattern "Smoke test: done" -Quiet)) { $failures += "$arguments didn't finish the smoke test" }
          }
          if ($failures) { $failures | ForEach-Object { Write-Host "FAILED: $_" }; throw "The window smoke test failed" }

      # Only when the smoke test failed: run a debug build under the debugger to see where it crashed
      - name: Where the window crashed
        if: failure()
        shell: pwsh
        working-directory: rust
        run: |
          cargo build -p wr-window
          $cdb = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x64\cdb.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $cdb) { Write-Host "No cdb.exe on this runner"; exit 0 }
          $env:WHITE_RABBIT_SMOKE_TEST = "1"
          $env:APPDATA = "$PWD\debug-appdata"
          $env:LOCALAPPDATA = "$PWD\debug-appdata"
          Set-Content cdb-commands.txt "sxe -c `".ecxr;kn 60;~*kn 30;q`" av`ng"
          foreach ($tab in @("music", "games")) {
            Write-Host "== debug build, --window --tab $tab"
            & $cdb.FullName -g -G -lines -cf cdb-commands.txt target\debug\WhiteRabbitWindow.exe --window --tab $tab
          }

      # Code signing placeholder (not enabled yet). Unsigned builds show a SmartScreen warning.
      # - name: Sign executables
      #   shell: pwsh
      #   run: |
      #     signtool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
      #       /f cert.pfx /p "${{ secrets.SIGNING_CERT_PASSWORD }}" dist\WhiteRabbit\WhiteRabbit.exe dist\WhiteRabbit\WhiteRabbitWindow.exe

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer and portable zip
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.version.outputs.version }}" "/DAppVersionNumbers=${{ steps.version.outputs.numbers }}" installer\white_rabbit.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          # Every exe should carry its file details and icon (antivirus scanners distrust blank ones)
          foreach ($exe in @("dist\WhiteRabbit-setup.exe", "dist\WhiteRabbit\WhiteRabbit.exe", "dist\WhiteRabbit\WhiteRabbitWindow.exe")) {
            $info = (Get-Item $exe).VersionInfo
            $info | Format-List FileName, FileVersion, ProductVersion, CompanyName, FileDescription, ProductName, LegalCopyright
            if (-not $info.CompanyName -or $info.FileVersion -match '^0\.0\.0') { throw "$exe has blank file details" }
            if ("$($info.ProductVersion)".Trim() -ne "${{ steps.version.outputs.version }}") { throw "$exe has version $($info.ProductVersion)" }
          }
          # No Python may be shipped: fail if any file in the app folder is a PyInstaller bundle or Python itself
          $python = Get-ChildItem dist\WhiteRabbit -Recurse -File | Where-Object {
            $_.Name -match '^python\d*\.dll$|\.pyd$|\.pyc$|^base_library\.zip$' -or
            (Select-String -Path $_.FullName -Pattern 'PyInstaller', '_MEIPASS', 'PYZ-00' -SimpleMatch -Quiet)
          }
          if ($python) { $python | Format-Table FullName; throw "Python/PyInstaller files found in the app" }
          Write-Host "No Python or PyInstaller inside the app"
          # Portable: the same files in a zip; unzip anywhere and run WhiteRabbit.exe (nothing is installed)
          Compress-Archive -Path dist\WhiteRabbit\* -DestinationPath dist\WhiteRabbit-portable.zip -Force
          Get-Item dist\WhiteRabbit-setup.exe, dist\WhiteRabbit-portable.zip, dist\WhiteRabbit\*.exe | Format-Table Name, Length

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: WhiteRabbit-setup.exe
          path: dist/WhiteRabbit-setup.exe
          if-no-files-found: error

      - name: Upload portable zip
        uses: actions/upload-artifact@v4
        with:
          name: WhiteRabbit-portable.zip
          path: dist/WhiteRabbit-portable.zip
          if-no-files-found: error
          compression-level: 0

      - name: Upload the app exe on its own
        uses: actions/upload-artifact@v4
        with:
          name: WhiteRabbit.exe
          path: dist/WhiteRabbit/WhiteRabbit.exe
          if-no-files-found: error

      - name: Upload the LED Matrix firmware
        uses: actions/upload-artifact@v4
        with:
          name: ledmatrix.uf2
          path: dist/ledmatrix.uf2
          if-no-files-found: error

  release:
    # A v* tag, or Run workflow with a version (default "next"), publishes a GitHub Release,
    # once the tests and the build have both passed.
    # The file names stay the same in every release so the README's "latest" download links keep working.
    name: Publish the release
    needs: [version, tests, build]
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: White Rabbit - Framework 16 LED Control ${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          body: |
            - `WhiteRabbit-setup.exe`: installer (starts with Windows, Start menu shortcut)
            - `WhiteRabbit-portable.zip`: portable app, nothing is installed. Unzip it anywhere and run `WhiteRabbit.exe`
            - `ledmatrix.uf2`: LED Matrix firmware with the startup animation setting and the extra Game of Life patterns (the app's Firmware page can flash it too)

            The whole app is now written in Rust: no Python inside, a fraction of the memory, and nothing for antivirus scanners to mistake for a packed Python program.
          generate_release_notes: true
          make_latest: "true"
          fail_on_unmatched_files: true
          files: |
            dist/WhiteRabbit-setup.exe
            dist/WhiteRabbit-portable.zip
            dist/ledmatrix.uf2

  build-passed:
    # One check that sums up the whole build. The repo's "Require passing build" rule
    # waits for this before the PR can be merged.
    name: Build passed
    if: always()
    needs: [version, tests, build]
    runs-on: ubuntu-latest
    steps:
      - name: Check that every build job passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
