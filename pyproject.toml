[project]
name = "white-rabbit-framework-matrix"
# Test builds use this version; a release uses the version typed in when running the workflow
version = "0.1.0"
description = "One app for the Framework Laptop 16 LED Matrix: system monitor, layout editor, games, startup animation and firmware"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
